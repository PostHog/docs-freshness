name: Control plane

on:
  push:
    branches: [main]
    paths:
      - control_plane/**
      - agents/**
      - config/posthog.json
      - .github/workflows/control-plane.yml

permissions: {}

concurrency:
  group: control-plane
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply the Loop
        run: python3 -m control_plane --apply config/posthog.json
        env:
          POSTHOG_HOST: https://us.posthog.com
          POSTHOG_PROJECT_ID: '2'
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.DOCS_FRESHNESS_POSTHOG_API_KEY }}
          DOCS_FRESHNESS_OWNER_UUID: ${{ vars.DOCS_FRESHNESS_OWNER_UUID }}
