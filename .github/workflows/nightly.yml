name: Nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      POSTHOG_HOST: https://us.posthog.com
      POSTHOG_PROJECT_ID: '2'
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.DOCS_FRESHNESS_POSTHOG_API_KEY }}
      DOCS_FRESHNESS_OWNER_UUID: ${{ vars.DOCS_FRESHNESS_OWNER_UUID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: docs-freshness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PostHog/posthog.com
          ref: master
          path: posthog.com
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PostHog/posthog
          ref: master
          path: posthog
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PostHog/posthog-js
          ref: main
          path: posthog-js
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PostHog/posthog-python
          ref: main
          path: posthog-python
          fetch-depth: 0
          persist-credentials: false
      - name: Record each checkout's default branch
        run: |
          git -C posthog.com remote set-head origin master
          git -C posthog remote set-head origin master
          git -C posthog-js remote set-head origin main
          git -C posthog-python remote set-head origin main
      - name: Restore unsent events
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: docs-freshness/docaudit/data/unsent-events
          key: unsent-events-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: unsent-events-
      - name: Refresh the claim map
        working-directory: docs-freshness/docaudit
        run: ./refresh.sh --no-pull
      - name: Publish the claim map
        working-directory: docs-freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view claim-map --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create claim-map --repo "$GITHUB_REPOSITORY" --title 'Claim map' --notes 'Rolling doc-references.json from the nightly refresh.' --latest=false
          fi
          gh release upload claim-map docaudit/output/doc-references.json --clobber --repo "$GITHUB_REPOSITORY"
      - name: Capture impact feedback
        working-directory: docs-freshness/docaudit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 report_metrics.py --impact-feedback
      - name: Save unsent events
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: docs-freshness/docaudit/data/unsent-events
          key: unsent-events-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check the Loop for drift
        working-directory: docs-freshness
        run: python3 -m control_plane --fail-on-drift config/posthog.json
